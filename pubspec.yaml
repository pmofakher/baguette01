name: baguette
description: باگت - باگ ولخرجیت رو پیدا کن
publish_to: none
version: 0.3.3+5

environment:
  sdk: ^3.4.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  sqflite_sqlcipher: ^3.1.0+1
  flutter_secure_storage: ^9.2.2
  path: ^1.9.0
  path_provider: ^2.1.4
  shamsi_date: ^1.1.1
  fl_chart: ^0.69.0
  uuid: ^4.5.1
  share_plus: ^10.0.0
  file_picker: ^8.1.2
  flutter_sms_inbox: ^1.0.5
  permission_handler: ^13.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/icons/app_icon.png
  adaptive_icon_background: assets/icons/ic_background.png
  adaptive_icon_foreground: assets/icons/ic_foreground.png
  adaptive_icon_foreground_inset: 0
  adaptive_icon_monochrome: assets/icons/ic_monochrome.png
  min_sdk_android: 23

flutter:
  uses-material-design: true
  assets:
    - assets/images/
  # فونت یکان‌بخ (Yekan Bakh) مجانی نیست و همراه پروژه نیست.
  # فایل‌ها را در assets/fonts بگذارید و این بلوک را از کامنت درآورید:
  # fonts:
  #   - family: YekanBakh
  #     fonts:
  #       - asset: assets/fonts/YekanBakh-Regular.ttf
  #       - asset: assets/fonts/YekanBakh-Bold.ttf
  #         weight: 700
